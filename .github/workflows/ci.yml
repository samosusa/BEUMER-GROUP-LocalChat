name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Added when the desktop client landed: lint and test now need dependencies.
      # The Electron binary is a ~100 MB download this job never runs.
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - run: npm run lint
      - run: npm test
      - run: npm start > /tmp/localchat.log 2>&1 &
      - run: sleep 1 && npm run bench
