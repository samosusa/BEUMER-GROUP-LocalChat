name: Enforce Jira Commit Key On Push

on:
  push:
    branches:
      - '**'

jobs:
  validate-push-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pushed commit messages
        run: |
          set -euo pipefail
          SHAS=$(jq -r '.commits[]?.id' "$GITHUB_EVENT_PATH")
          if [ -z "$SHAS" ]; then
            echo "No pushed commits in payload"
            exit 0
          fi

          for c in $SHAS; do
            MSG=$(git log -1 --pretty=format:%s "$c")
            echo "Commit $c: $MSG"
            if [[ ! "$MSG" =~ ^LCHAT-[0-9]+ ]]; then
              echo "::error::Commit $c message must start with a Jira key like LCHAT-123"
              exit 1
            fi
          done
