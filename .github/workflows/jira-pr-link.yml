name: Add Jira info to PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  jira:
    runs-on: ubuntu-latest
    steps:
      - name: Find Jira issue key
        id: issue
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="${{ github.head_ref }} ${{ github.event.pull_request.title }}"
          ISSUE=$(echo "$SOURCE" | grep -Eo 'LCHAT-[0-9]+' | head -n1 || true)
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "Detected issue key: ${ISSUE:-<none>}"

      - name: Add Jira info to PR
        if: ${{ steps.issue.outputs.issue != '' }}
        uses: actions/github-script@v7
        env:
          ISSUE_KEY: ${{ steps.issue.outputs.issue }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
        with:
          script: |
            const issue = process.env.ISSUE_KEY;
            if (!issue) {
              core.info('No Jira issue key found; skipping PR body update.');
              return;
            }

            const base = (process.env.JIRA_BASE_URL || '').replace(/\/$/, '');
            const jiraLine = base
              ? `Jira: [${issue}](${base}/browse/${issue})`
              : `Jira: ${issue}`;
            const marker = '<!-- jira-link -->';
            const block = `${marker}\n${jiraLine}`;

            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const markerRegex = /<!-- jira-link -->[\s\S]*?(\n\n|$)/;
            const newBody = markerRegex.test(body)
              ? body.replace(markerRegex, `${block}\n\n`)
              : `${block}\n\n${body}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: newBody
            });
