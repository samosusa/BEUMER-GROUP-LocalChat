name: Enforce Jira Commit Key

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Check current branch commit message
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          MSG=$(git log -1 --pretty=format:%s "$HEAD_SHA")
          echo "Current branch commit $HEAD_SHA: $MSG"
          if [[ ! "$MSG" =~ ^LCHAT-[0-9]+ ]]; then
            echo "::error::Current branch commit $HEAD_SHA message must start with a Jira key like LCHAT-123"
            exit 1
          fi
