[pytest]
# `pytest` from the repository root could not import `src`: with no configuration, pytest
# puts the directory holding tests/conftest.py on sys.path - tests/ - and the repository
# root never gets there, so every `from src...` in the suite failed at collection. The
# README has said "run pytest" the whole time; it only ever worked for people who happened
# to run `python -m pytest` (which adds the working directory) or who ran it in Docker,
# where the package is installed. CI runs no Python at all, so nothing caught it.
pythonpath = .
testpaths = tests
