server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is a hash-routed SPA, so every path resolves to the one entry document.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker must never be cached, or a rebuilt image keeps serving the old
    # mock handlers to anyone who opened the previous one.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-store";
    }

    # Bundle filenames are content-hashed, so they can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
