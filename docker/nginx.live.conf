server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded documents can be several MB; nginx's 1m default would reject them.
    client_max_body_size 100m;

    # The app is a hash-routed SPA, so every path resolves to the one entry document.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bundle filenames are content-hashed, so they can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The service's own routes (see apps/renderer/vite.config.ts SERVICE_ROUTES), proxied to
    # the "app" container by its Compose network alias. src/app.py installs no CORS
    # middleware, so the renderer is built with LOCALCHAT_SERVICE=live, which makes it call
    # these as same-origin relative paths; nginx forwarding them here is what makes that work
    # without any browser CORS request ever happening. proxy_pass has no path component, so
    # nginx forwards the original request URI unchanged, subpaths included.
    location /health {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params.conf;
    }
    location /docs {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params.conf;
    }
    location /ingest {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params.conf;
    }
    location /status {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params.conf;
    }
    location /query {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params.conf;
    }
    location /conversations {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params.conf;
    }
    location /models {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params.conf;
    }
    location /benchmark {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params.conf;
    }
    location /projects {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params.conf;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
